<!DOCTYPE html><html><body style="margin:0;background:#556"><canvas id="c" width="1600" height="900"></canvas>
<script src="../js/assets.js"></script><script src="../js/art.js"></script>
<script>
var c=document.getElementById('c').getContext('2d');
ZRArt.load(function(){
  c.fillStyle='#8a9aa8';c.fillRect(0,0,1600,900);
  c.save();c.scale(1.4,1.4);
  var poses=[['run',0],['run',1.6],['run',3.1],['jump',0],['fall',0],['slide',0],['hurt',0]];
  poses.forEach(function(p,i){c.save();c.translate(70+i*100,220);ZRArt.hero(c,{pose:p[0],phase:p[1]});c.restore();});
  [['slash',0.1],['slash',0.6],['cleave',0.2],['cleave',0.7],['spin',0.3]].forEach(function(p,i){c.save();c.translate(70+i*140,450);ZRArt.hero(c,{pose:'run',phase:0.5,atype:p[0],at:p[1],power:i==4});c.restore();});
  c.restore();
  var outfits=['city','swim','swim','hiker','tourist','fisher','cane'];
  c.save();c.translate(0,0);
  outfits.forEach(function(o,i){var z={type:i==2?'brute':'walker',phase:i,seed:i+1,skin:'#7f9670',outfit:ZRArt.outfit(o,i*7+ (o=='swim'&&i==2?2:0)),head:o=='swim'&&i==1?'zHead0':['zHead0','zHead1','zHead2'][i%3]};
    c.save();c.translate(1000+ (i%4)*150, 250+Math.floor(i/4)*250);ZRArt.zombie(c,z);c.restore();});
  var extra=[{type:'crawler',phase:1,seed:3,skin:'#7f9670',outfit:ZRArt.outfit('city',3),head:'zHead0'},{type:'monkey',phase:1,tr:1},{type:'monkey',phase:1,tr:0},{type:'fish',tr:1},{type:'fish',tr:0},
   {type:'walker',phase:0.5,seed:4,skin:'#7f9670',tr:0,humanSkin:'#c08a60',outfit:ZRArt.outfit('hiker',2),head:'zHead0',panic:true}];
  extra.forEach(function(z,i){c.save();c.translate(80+i*150,800);c.scale(1.3,1.3);ZRArt.zombie(c,z);c.restore();});
  c.save();c.translate(1100,860);ZRArt.zombie(c,{type:'boss',phase:0,seed:9,skin:'#5f7a52',outfit:ZRArt.outfit('city',1),head:'zHead2'});c.restore();
  window.done=true;
});
</script></body></html>
